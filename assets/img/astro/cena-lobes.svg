<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" width="820" height="820" role="img" aria-labelledby="cenaTitle cenaDesc">
  <title id="cenaTitle">Stylised radio galaxy with giant lobes and X-ray point sources</title>
  <desc id="cenaDesc">An original schematic illustration: an elliptical host galaxy crossed by a dark dust lane, with a bipolar jet inflating two elongated giant lobes, surface-brightness contours, and scattered compact X-ray sources with detection apertures projected across the lobes.</desc>

  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="18%"  stop-color="#e6ecff" stop-opacity="0.72"/>
      <stop offset="48%"  stop-color="#9fb0ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7b8cff" stop-opacity="0"/>
    </radialGradient>

    <!-- lobes: elongated along the jet axis, brighter at the inner edge -->
    <radialGradient id="lobeN" cx="50%" cy="72%" r="58%">
      <stop offset="0%"   stop-color="#6fd8ea" stop-opacity="0.34"/>
      <stop offset="40%"  stop-color="#6f86ff" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#5566cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lobeS" cx="50%" cy="28%" r="58%">
      <stop offset="0%"   stop-color="#6fd8ea" stop-opacity="0.30"/>
      <stop offset="40%"  stop-color="#6f86ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#5566cc" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="jet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#4fd2e6" stop-opacity="0"/>
      <stop offset="26%"  stop-color="#bff0fa" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="74%"  stop-color="#bff0fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4fd2e6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dust" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0%"   stop-color="#04060d" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#04060d" stop-opacity="0.92"/>
      <stop offset="82%"  stop-color="#04060d" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#04060d" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft"   x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="softer" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="38"/></filter>

    <!-- faint diffuse texture so the lobes do not read as flat vector shapes -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>

    <clipPath id="clipN"><ellipse cx="410" cy="212" rx="150" ry="196"/></clipPath>
    <clipPath id="clipS"><ellipse cx="410" cy="610" rx="140" ry="184"/></clipPath>
  </defs>

  <g transform="rotate(-19 410 410)">

    <!-- diffuse lobe emission, elongated along the jet -->
    <ellipse cx="410" cy="212" rx="152" ry="198" fill="url(#lobeN)" filter="url(#softer)"/>
    <ellipse cx="410" cy="610" rx="142" ry="186" fill="url(#lobeS)" filter="url(#softer)"/>
    <g clip-path="url(#clipN)"><rect x="240" y="0" width="340" height="420" filter="url(#grain)"/></g>
    <g clip-path="url(#clipS)"><rect x="250" y="410" width="320" height="400" filter="url(#grain)"/></g>

    <!-- surface-brightness contours: nested, slightly offset, not concentric rings -->
    <g fill="none" stroke="#8fa2ff" stroke-opacity="0.19" stroke-width="1">
      <ellipse cx="410" cy="208" rx="138" ry="180"/>
      <ellipse cx="404" cy="228" rx="103" ry="140" transform="rotate(-4 404 228)"/>
      <ellipse cx="414" cy="252" rx="70"  ry="100" transform="rotate(3 414 252)"/>
      <ellipse cx="410" cy="288" rx="40"  ry="60"/>
      <ellipse cx="410" cy="614" rx="130" ry="170"/>
      <ellipse cx="416" cy="596" rx="96"  ry="132" transform="rotate(5 416 596)"/>
      <ellipse cx="406" cy="572" rx="64"  ry="94"  transform="rotate(-3 406 572)"/>
      <ellipse cx="410" cy="540" rx="36"  ry="56"/>
    </g>

    <!-- jet axis -->
    <line x1="410" y1="70" x2="410" y2="762" stroke="url(#jet)" stroke-width="2.1"/>

    <!-- host galaxy -->
    <ellipse cx="410" cy="410" rx="146" ry="104" fill="url(#core)" filter="url(#soft)"/>
    <ellipse cx="410" cy="410" rx="90"  ry="62"  fill="url(#core)"/>

    <!-- dust lane across the host -->
    <g transform="rotate(12 410 410)">
      <rect x="250" y="394" width="320" height="30" fill="url(#dust)" rx="15"/>
      <rect x="266" y="387" width="288" height="9"  fill="url(#dust)" rx="4.5" opacity="0.6"/>
    </g>

    <!-- nucleus -->
    <circle cx="410" cy="410" r="5" fill="#ffffff" fill-opacity="0.96"/>
    <circle cx="410" cy="410" r="14" fill="#ffffff" fill-opacity="0.12"/>

    <!-- compact X-ray sources projected across the lobes -->
    <g fill="#e4ebff">
      <circle cx="356" cy="132" r="2.3" fill-opacity="0.84"/><circle cx="468" cy="180" r="1.8" fill-opacity="0.68"/>
      <circle cx="330" cy="240" r="2.0" fill-opacity="0.76"/><circle cx="496" cy="262" r="2.5" fill-opacity="0.88"/>
      <circle cx="408" cy="96"  r="1.6" fill-opacity="0.58"/><circle cx="300" cy="182" r="1.5" fill-opacity="0.52"/>
      <circle cx="520" cy="196" r="1.9" fill-opacity="0.70"/><circle cx="440" cy="230" r="1.4" fill-opacity="0.50"/>
      <circle cx="372" cy="296" r="2.1" fill-opacity="0.78"/><circle cx="486" cy="330" r="1.6" fill-opacity="0.55"/>
      <circle cx="352" cy="648" r="2.2" fill-opacity="0.80"/><circle cx="470" cy="592" r="1.7" fill-opacity="0.64"/>
      <circle cx="316" cy="560" r="2.4" fill-opacity="0.85"/><circle cx="508" cy="668" r="1.9" fill-opacity="0.70"/>
      <circle cx="412" cy="722" r="1.6" fill-opacity="0.56"/><circle cx="308" cy="668" r="1.5" fill-opacity="0.52"/>
      <circle cx="524" cy="596" r="2.0" fill-opacity="0.73"/><circle cx="442" cy="548" r="1.4" fill-opacity="0.48"/>
      <circle cx="386" cy="618" r="2.3" fill-opacity="0.82"/><circle cx="340" cy="500" r="1.6" fill-opacity="0.54"/>
      <circle cx="236" cy="372" r="1.6" fill-opacity="0.44"/><circle cx="590" cy="452" r="1.8" fill-opacity="0.48"/>
    </g>

    <!-- detection apertures on a subset -->
    <g fill="none" stroke="#4fd2e6" stroke-opacity="0.5" stroke-width="1">
      <circle cx="496" cy="262" r="11"/><circle cx="316" cy="560" r="11"/>
      <circle cx="356" cy="132" r="9"/><circle cx="386" cy="618" r="9"/>
      <circle cx="372" cy="296" r="8"/>
    </g>
  </g>
</svg>

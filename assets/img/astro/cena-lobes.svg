<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" width="820" height="820" role="img" aria-labelledby="cenaTitle cenaDesc">
  <title id="cenaTitle">Stylised radio galaxy with giant lobes and X-ray point sources</title>
  <desc id="cenaDesc">An original schematic illustration: an elliptical galaxy crossed by a dark dust lane, with a bipolar jet inflating two diffuse giant lobes, and scattered compact X-ray sources projected across them.</desc>

  <defs>
    <radialGradient id="cenaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fdf6ff" stop-opacity="0.95"/>
      <stop offset="26%"  stop-color="#cbd2ff" stop-opacity="0.62"/>
      <stop offset="62%"  stop-color="#7b8cff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#7b8cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cenaLobe" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4fd2e6" stop-opacity="0.30"/>
      <stop offset="48%"  stop-color="#6f86ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7b8cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cenaJet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#4fd2e6" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a9ecf7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4fd2e6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cenaDust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#05070f" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#05070f" stop-opacity="0.88"/>
      <stop offset="78%"  stop-color="#05070f" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#05070f" stop-opacity="0"/>
    </linearGradient>

    <filter id="cenaSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="cenaSofter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <g transform="rotate(-22 410 410)">

    <!-- giant lobes -->
    <ellipse cx="410" cy="196" rx="188" ry="176" fill="url(#cenaLobe)" filter="url(#cenaSofter)"/>
    <ellipse cx="410" cy="628" rx="176" ry="166" fill="url(#cenaLobe)" filter="url(#cenaSofter)"/>

    <!-- lobe boundary contours: thin, scientific -->
    <g fill="none" stroke="#7b8cff" stroke-opacity="0.20" stroke-width="1">
      <ellipse cx="410" cy="200" rx="168" ry="156"/>
      <ellipse cx="410" cy="206" rx="122" ry="112"/>
      <ellipse cx="410" cy="212" rx="74"  ry="68"/>
      <ellipse cx="410" cy="622" rx="156" ry="146"/>
      <ellipse cx="410" cy="616" rx="112" ry="104"/>
      <ellipse cx="410" cy="610" rx="66"  ry="62"/>
    </g>

    <!-- jet axis -->
    <line x1="410" y1="128" x2="410" y2="700" stroke="url(#cenaJet)" stroke-width="2.2"/>

    <!-- host galaxy -->
    <ellipse cx="410" cy="410" rx="150" ry="112" fill="url(#cenaCore)" filter="url(#cenaSoft)"/>
    <ellipse cx="410" cy="410" rx="96"  ry="70"  fill="url(#cenaCore)"/>

    <!-- dust lane -->
    <g transform="rotate(14 410 410)">
      <rect x="250" y="392" width="320" height="34" fill="url(#cenaDust)" rx="17"/>
      <rect x="262" y="386" width="296" height="10" fill="url(#cenaDust)" rx="5" opacity="0.55"/>
    </g>

    <!-- nucleus -->
    <circle cx="410" cy="410" r="5.5" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="410" cy="410" r="15"  fill="#ffffff" fill-opacity="0.14"/>

    <!-- compact X-ray sources projected across the lobes -->
    <g fill="#dfe7ff">
      <circle cx="352" cy="150" r="2.4" fill-opacity="0.85"/>
      <circle cx="470" cy="184" r="1.9" fill-opacity="0.70"/>
      <circle cx="318" cy="248" r="2.1" fill-opacity="0.78"/>
      <circle cx="508" cy="266" r="2.6" fill-opacity="0.88"/>
      <circle cx="404" cy="112" r="1.7" fill-opacity="0.60"/>
      <circle cx="286" cy="196" r="1.6" fill-opacity="0.55"/>
      <circle cx="540" cy="196" r="2.0" fill-opacity="0.72"/>
      <circle cx="436" cy="236" r="1.5" fill-opacity="0.52"/>
      <circle cx="368" cy="286" r="2.2" fill-opacity="0.80"/>
      <circle cx="352" cy="642" r="2.3" fill-opacity="0.82"/>
      <circle cx="474" cy="596" r="1.8" fill-opacity="0.66"/>
      <circle cx="308" cy="566" r="2.5" fill-opacity="0.86"/>
      <circle cx="522" cy="668" r="2.0" fill-opacity="0.72"/>
      <circle cx="412" cy="710" r="1.7" fill-opacity="0.58"/>
      <circle cx="296" cy="672" r="1.6" fill-opacity="0.54"/>
      <circle cx="546" cy="592" r="2.1" fill-opacity="0.75"/>
      <circle cx="440" cy="556" r="1.5" fill-opacity="0.50"/>
      <circle cx="386" cy="618" r="2.4" fill-opacity="0.84"/>
      <circle cx="228" cy="368" r="1.7" fill-opacity="0.48"/>
      <circle cx="596" cy="446" r="1.9" fill-opacity="0.52"/>
    </g>

    <!-- detection apertures on a few sources -->
    <g fill="none" stroke="#4fd2e6" stroke-opacity="0.55" stroke-width="1">
      <circle cx="508" cy="266" r="11"/>
      <circle cx="308" cy="566" r="11"/>
      <circle cx="352" cy="150" r="9"/>
      <circle cx="386" cy="618" r="9"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Karthik Balasubramaniam — X-ray Astrophysicist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e20"/><stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b8cff"/><stop offset="1" stop-color="#4fd2e6"/>
    </linearGradient>
    <radialGradient id="lobe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd2e6" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#7b8cff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#c9d2ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g transform="rotate(-22 960 300)">
    <ellipse cx="960" cy="150" rx="190" ry="180" fill="url(#lobe)"/>
    <ellipse cx="960" cy="450" rx="180" ry="170" fill="url(#lobe)"/>
    <g fill="none" stroke="#7b8cff" stroke-opacity="0.22" stroke-width="1.5">
      <ellipse cx="960" cy="155" rx="160" ry="150"/>
      <ellipse cx="960" cy="160" rx="105" ry="98"/>
      <ellipse cx="960" cy="445" rx="150" ry="140"/>
      <ellipse cx="960" cy="440" rx="98" ry="92"/>
    </g>
    <line x1="960" y1="20" x2="960" y2="580" stroke="url(#g)" stroke-width="2" opacity="0.5"/>
    <ellipse cx="960" cy="300" rx="130" ry="92" fill="url(#core)"/>
    <circle cx="960" cy="300" r="6" fill="#ffffff"/>
    <g fill="#dfe7ff">
      <circle cx="905" cy="120" r="3" opacity="0.85"/><circle cx="1020" cy="180" r="2.4" opacity="0.7"/>
      <circle cx="880" cy="215" r="2.6" opacity="0.75"/><circle cx="1055" cy="245" r="3" opacity="0.85"/>
      <circle cx="900" cy="470" r="3" opacity="0.8"/><circle cx="1030" cy="425" r="2.4" opacity="0.68"/>
      <circle cx="865" cy="395" r="2.8" opacity="0.8"/><circle cx="1060" cy="490" r="2.4" opacity="0.7"/>
    </g>
  </g>

  <rect x="82" y="150" width="300" height="4" rx="2" fill="url(#g)"/>
  <text x="82" y="232" font-family="Sora, Inter, sans-serif" font-size="62" font-weight="700" fill="#e9edf7">X-ray astrophysics</text>
  <text x="82" y="308" font-family="Sora, Inter, sans-serif" font-size="62" font-weight="700" fill="#8fa2ff">of black holes &amp; AGN</text>
  <text x="82" y="392" font-family="Inter, sans-serif" font-size="34" font-weight="600" fill="#e9edf7">Dr. Karthik Balasubramaniam</text>
  <text x="82" y="440" font-family="Inter, sans-serif" font-size="25" fill="#a3aec7">Astrophysicist · X-ray Astronomy · AGN · Black-Hole Accretion</text>
  <text x="82" y="512" font-family="Inter, sans-serif" font-size="23" fill="#76819c">Chandra · XMM-Newton · NuSTAR</text>
</svg>
